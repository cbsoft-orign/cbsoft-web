    <script>
      (function () {
        function isExtensionMetaMaskError(reasonOrEvent) {
          var message = '';
          var stack = '';
          var filename = '';
          if (reasonOrEvent) {
            if (typeof reasonOrEvent === 'string') {
              message = reasonOrEvent;
            } else {
              message =
                reasonOrEvent.message ||
                (reasonOrEvent.reason && reasonOrEvent.reason.message) ||
                String(reasonOrEvent.reason || '');
              stack =
                reasonOrEvent.stack ||
                (reasonOrEvent.reason && reasonOrEvent.reason.stack) ||
                (reasonOrEvent.error && reasonOrEvent.error.stack) ||
                '';
              filename = reasonOrEvent.filename || '';
            }
          }
          return (
            filename.indexOf('chrome-extension://') === 0 ||
            stack.indexOf('chrome-extension://') !== -1 ||
            message.indexOf('Failed to connect to MetaMask') !== -1
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            if (isExtensionMetaMaskError(event)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (isExtensionMetaMaskError(event)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
